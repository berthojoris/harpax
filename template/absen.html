<!-- Gradient Overlay for readability at bottom -->
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/70 to-transparent pointer-events-none"></div>
<!-- Location Status Chip -->
<div class="relative z-10 bg-surface/90 backdrop-blur-sm rounded-full px-4 py-2 flex items-center gap-2 shadow-sm border border-outline-variant/30 mb-8">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">location_on</span>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Lokasi Saat Ini</span>

</div>
<span class="material-symbols-outlined text-primary ml-2 text-sm">check_circle</span>
</div>

<div class="relative z-10 flex flex-col items-center mb-8">
