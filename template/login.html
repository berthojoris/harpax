<body class="bg-background min-h-screen flex items-center justify-center p-container-margin font-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
<main class="w-full max-w-sm bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(23,43,77,0.12)] p-lg md:p-xl flex flex-col gap-xl">
<!-- Header / Brand -->
<header class="text-center flex flex-col items-center gap-sm">
<div class="w-16 h-16 bg-surface-container-low text-primary rounded-full flex items-center justify-center mb-xs shadow-sm border border-surface-container">
<span class="material-symbols-outlined text-[32px]">group_work</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">WorkForce</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Silakan masuk ke akun Anda</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-md">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface ml-xs" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-gutter flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">mail</span>
</div>
<input class="w-full pl-[40px] pr-gutter py-gutter bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="email" placeholder="nama@perusahaan.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center ml-xs mr-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Lupa?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-gutter flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">lock</span>
</div>
<input class="w-full pl-[40px] pr-gutter py-gutter bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Call to Action -->
<button class="w-full h-[48px] mt-xs bg-primary text-on-primary font-label-lg text-label-lg rounded-lg hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all shadow-[0px_2px_4px_rgba(23,43,77,0.05)] flex justify-center items-center gap-sm" type="submit">
                Masuk
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<footer class="text-center mt-xs border-t border-surface-container pt-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                Belum punya akun? <a class="font-label-md text-label-md text-primary hover:underline ml-xs" href="#">Daftar sekarang</a>
</p>
</footer>
</main>
